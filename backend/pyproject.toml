[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "DTZ"]
ignore = [
  "UP017", # timezone.utc 与 UTC 等价，保留兼容且不影响 UTC 语义。
  "UP046", # Pydantic 泛型暂保留 TypeVar/Generic 写法。
  "UP047",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/sessions.py" = ["N815"] # 已发布给前端的 camelCase 会话契约。
"app/db/mixins.py" = ["N811"]
"app/models/*.py" = ["N811"] # SQLAlchemy DATETIME 的可读类型别名。
"tests/**/*.py" = ["DTZ001"] # 覆盖 MySQL UTC-naive 时间语义。
